# Release web-app thành Docker image trên GHCR (cùng quy trình với các service):
#   PR dev -> production : job release-check (quyền chỉ đọc) build image nhưng không push -> lộ lỗi trước khi merge
#   merge vào production : job release push ghcr.io/<repo>:X.Y.Z + latest, tag vX.Y.Z, GitHub Release
# Version lấy từ package.json; tăng version trên dev trước khi release: npm version minor --no-git-tag-version
name: Release

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release-check:
    # Tên check phải trùng ruleset production chép từ repo service mẫu ("release-check / release")
    name: release-check / release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Chặn release trùng version
        run: |
          VER=$(node -p "require('./package.json').version")
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "::error::v$VER đã release rồi. Hãy tăng version trên dev: npm version minor --no-git-tag-version"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build thử image (không push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tạo tag + GitHub Release
      packages: write # push image lên GHCR
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Đọc version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Chặn release trùng version
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "::error::v$VER đã release rồi. Hãy tăng version trên dev: npm version minor --no-git-tag-version"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
      - name: Tạo tag + GitHub Release
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$VER" --target "$GITHUB_SHA" --title "v$VER" --generate-notes \
            --notes "Docker image: \`$IMAGE:$VER\`"
